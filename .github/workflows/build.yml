name: Build 3DStify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS libraries (mpg123)
        run: dkp-pacman -S --noconfirm --needed 3ds-mpg123 || echo "package server unavailable, using libraries already in the image"

      - name: Install tools (makerom, bannertool, stb_image)
        run: |
          apt-get update && apt-get install -y --no-install-recommends wget unzip ca-certificates
          mkdir -p /tmp/tools && cd /tmp/tools
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O makerom.zip
          unzip -o -q makerom.zip -d makerom
          install -m755 "$(find makerom -type f -name makerom | head -n1)" /usr/local/bin/makerom
          wget -q https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip -O bannertool.zip
          unzip -o -q bannertool.zip -d bannertool
          install -m755 "$(find bannertool -type f -path '*linux-x86_64*' -name bannertool | head -n1)" /usr/local/bin/bannertool
          cd "$GITHUB_WORKSPACE"
          wget -q https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -O source/stb_image.h

      - name: Build .3dsx and .cia
        run: make cia

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: 3DStify
          path: |
            3DStify.cia
            3DStify.3dsx

      # Keeps https://github.com/meerok/Meer-3DStify/releases/latest/download/3DStify.cia
      # (the link in the QR code) pointing at the newest build.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 3DStify v1.0.0
          make_latest: true
          overwrite_files: true
          body: |
            3DStify by Meer - a Spotify-style MP3 player for the Nintendo 3DS.
            Install `3DStify.cia` with FBI, or scan the QR code in the README with FBI > Remote Install > Scan QR Code.
          files: |
            3DStify.cia
            3DStify.3dsx
